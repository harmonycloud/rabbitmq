middlewareDefinition: rabbitmq-cluster-active
values:
  - name: rabbitmq
    path: spec|configurations|rabbitmq-config|values|args
    parameters:
      - clusterPartitionHandling:
          - name: default
            value: pause_minority
          - name: isReboot
            value: y
          - name: range
            value: [ pause_minority|autoheal|pause_if_all_down|ignore ]
          - name: describe
            value: "rabbitmq network partition strategy"
      - logLevel:
          - name: default
            value: info
          - name: isReboot
            value: y
          - name: range
            value: [ info|debug ]
          - name: describe
            value: "log level"
      - vmMemoryHighWatermarkRelative:
          - name: default
            value: 0.4
          - name: isReboot
            value: y
          - name: range
            value: [ 0-1.0 ]
          - name: describe
            value: "memory threshold for triggering flow control"
      - diskFreeLimitAbsolute:
          - name: default
            value: 2G
          - name: isReboot
            value: y
          - name: range
            value: [ 0-10G ]
          - name: describe
            value: "disk free space threshold for triggering flow control"