apiVersion: middleware.cn/v1
kind: MiddlewareBaseline
metadata:
  name: rabbitmq-cluster
  annotations:
    baselineName: "Cluster"
    description: "Cluster Mode Baseline, incorporating core functionality and essential dependencies, is tailored for rapid deployment and fundamental application scenarios. It delivers stable and reliable performance, and is designed for ease of extension and maintenance."
    mode: "HA"
spec:
  operatorBaseline:
    name: rabbitmq-operator-standard
    gvkName: v1alpha1
  necessary:
    repository: ""
    resource:
      rabbitmq:
        limits:
          cpu: '{"type":"string","label":"CPU","required":true,"description":"Please enter a custom quota, the unit is `Core`","placeholder":"Please enter a custom quota, the unit is `Core`","default":"2"}'
          memory: '{"type":"string","label":"Memory","required":true,"description":"Please enter a custom quota, the unit is `Gi`","placeholder":"Please enter a custom quota, the unit is `Gi`","default":"4"}'
        requests:
          cpu: '{"type":"string","label":"CPU","required":true,"description":"Please enter a custom quota, the unit is `Core`","placeholder":"Please enter a custom quota, the unit is `Core`","default":"2"}'
          memory: '{"type":"string","label":"Memory","required":true,"description":"Please enter a custom quota, the unit is `Gi`","placeholder":"Please enter a custom quota, the unit is `Gi`","default":"4"}'
        volume:
          size: '{"type":"int","label":"StorageSize","required":true,"pattern":"^(?!0$)(?!0\\d)\\d+(\\.\\d)?$","placeholder":"Please enter the storage size"}'
          storageClass: '{"type":"storageClass","label":"StorageClass","required":true,"description":"Please select storage","placeholder":"Please select storage"}'
        replicas: '{"type":"int","label":"Replicas","required":true,"description":"Please enter an odd number of instances greater than or equal to 3 (e.g., 3, 5, or 7).","default":3,"pattern":"^([3579]|[1-9][0-9]*[13579])$","placeholder":"Please enter an odd number of instances greater than or equal to 3 (e.g., 3, 5, or 7)."}'
    version: '{"type":"version","label":"Version","required":true,"default":"3.12.7"}'
  preActions:
    - name: pre-rabbitmq-alertrule-labels
      parameters:
        labels: {}
      exposed: false
    - name: pre-rabbitmq-logging
      parameters:
        fileLogging: true
        stdoutLogging: true
      exposed: true
    - name: pre-rabbitmq-affinity
      parameters:
        podAntiAffinityTopologKey: "kubernetes.io/hostname"
        podAntiAffinity: "soft"
        nodeAffinity: { }
      exposed: true
    - name: pre-rabbitmq-tolerations
      parameters:
        tolerations: [ ]
      exposed: true
  parameters:
    statefulsetComponent:
      broker:
        spec:
          template:
            metadata:
            spec:
              initContainers:
                - name: init
                  volumeMounts:
                    - mountPath: /opt/log
                      name: rabbitmq-log-volume
              containers:
                - name: rabbitmq
                  volumeMounts:
                    - mountPath: /var/log/rabbitmq
                      name: rabbitmq-log-volume
                  env:
                    - name: TZ
                      value: Asia/Shanghai
    brokerImage: "{{ .Necessary.repository }}/rabbitmq:3.12.7-management"
    replicas: "{{ .Necessary.resource.rabbitmq.replicas }}"
    healthCheckUser:
      user: "guest"
      password: "Hc@Cloud01"
    brokerCmNm: "{{ .Globe.Name }}-rabbitmq-config"
    initImage: "{{ .Necessary.repository }}/rabbitmq-init:v1.0.0"
    hostNetwork: false
    requests:
      cpu: '"{{ .Necessary.resource.rabbitmq.requests.cpu }}"'
      memory: '"{{ .Necessary.resource.rabbitmq.requests.memory }}"'
    limits:
      cpu: '"{{ .Necessary.resource.rabbitmq.limits.cpu }}"'
      memory: '"{{ .Necessary.resource.rabbitmq.limits.memory }}"'
    volumeClaimTemplates:
      - metadata:
          creationTimestamp: null
          name: rabbitmq-data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          dataSource: null
          resources:
            requests:
              storage: "{{ .Necessary.resource.rabbitmq.volume.size }}"
          storageClassName: "{{ .Necessary.resource.rabbitmq.volume.storageClass }}"
      - metadata:
          creationTimestamp: null
          name: rabbitmq-log-volume
        spec:
          accessModes:
            - ReadWriteOnce
          dataSource: null
          resources:
            requests:
              storage: 2Gi
          storageClassName: "{{ .Necessary.resource.rabbitmq.volume.storageClass }}"
  configurations:
    - name: rabbitmq-alertrule
      values:
        replicas: "{{ .Necessary.resource.rabbitmq.replicas }}"
    - name: rabbitmq-config
      values:
        args:
          clusterPartitionHandling: "pause_minority"
          vmMemoryHighWatermarkRelative: "0.4"
          defaultUser: '"{{ .Parameters.healthCheckUser.user }}"'
          defaultPassword: '"{{ .Parameters.healthCheckUser.password }}"'
          diskFreeLimitAbsolute: "2G"
          logLevel: "info"
          logRotationSize: "104857600"
          logRotationCount: "15"
        resources:
          requests:
            memory: '"{{ .Necessary.resource.rabbitmq.requests.memory }}"'
    - name: rabbitmq-serviceaccount
      values: {}
    - name: rabbitmq-role
      values: {}
    - name: rabbitmq-rolebinding
      values: {}
    - name: rabbitmq-servicemonitor
      values: {}